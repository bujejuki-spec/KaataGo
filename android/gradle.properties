# Memori Gradle dipatok SENGAJA kecil.
#
# Mesin build ini punya 8 GB RAM. Dulu Gradle diizinkan memakai 4 GB heap
# plus 2 GB metaspace — hampir seluruh RAM, sebelum kompiler Dart, Kotlin
# daemon, dan aplikasi lain mendapat bagiannya. Sisanya dilempar ke swap
# di disk, dan build yang dulu 17 menit merayap jadi 36 menit.
#
# Jatah yang lebih kecil justru lebih cepat: semuanya muat di RAM, dan
# tidak ada yang menunggu disk.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Hasil tugas yang tidak berubah dipakai ulang antar-build, bukan
# dikerjakan ulang dari nol tiap rilis.
org.gradle.caching=true

android.useAndroidX=true
# Jetifier dimatikan.
#
# Ia menulis ulang pustaka lama `com.android.support` jadi AndroidX, di
# setiap build, untuk setiap dependensi. Dependensi rilis proyek ini sudah
# diperiksa lewat `gradlew :app:dependencies --configuration
# releaseRuntimeClasspath`: nol `com.android.support`. Yang tersisa di
# manifest beberapa plugin cuma nama kunci `android.support.FILE_PROVIDER_PATHS`,
# yang memang tetap dipakai AndroidX — bukan pustaka.
#
# Kalau suatu hari build gagal dengan galat kelas `android.support.*`
# tidak ditemukan, ada paket baru yang masih memakai pustaka lama:
# nyalakan lagi, lalu cari paketnya.
android.enableJetifier=false
